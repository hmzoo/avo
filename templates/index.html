<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avo - Agent Visuel</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .video-panel {
            background: #1a1a2e;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .video-container {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1/1;
            background: #16213e;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border: 3px solid #667eea;
        }

        .video-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .status {
            margin-top: 20px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-size: 14px;
        }

        .status.processing {
            background: #f39c12;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .chat-panel {
            display: flex;
            flex-direction: column;
            height: 80vh;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            font-size: 24px;
            font-weight: bold;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 15px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message .timestamp {
            font-size: 11px;
            color: #888;
            margin-bottom: 5px;
        }

        .message .user-message {
            background: #667eea;
            color: white;
            padding: 12px 16px;
            border-radius: 18px 18px 5px 18px;
            display: inline-block;
            max-width: 80%;
            word-wrap: break-word;
        }

        .message .agent-message {
            background: white;
            color: #333;
            padding: 12px 16px;
            border-radius: 18px 18px 18px 5px;
            display: inline-block;
            max-width: 80%;
            word-wrap: break-word;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .message.user {
            text-align: right;
        }

        .message.agent {
            text-align: left;
        }

        .chat-input {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .chat-input input:focus {
            border-color: #667eea;
        }

        .chat-input button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .chat-input button:hover {
            transform: scale(1.05);
        }

        .chat-input button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .audio-controls {
            margin-top: 15px;
            width: 100%;
        }

        .audio-controls audio {
            width: 100%;
            border-radius: 10px;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="video-panel">
            <div class="video-container" id="videoContainer">
                <img src="/medias/face.png" id="faceImage" alt="Avo">
            </div>
            <div class="status" id="status">En attente...</div>
            <div class="audio-controls" id="audioControls" style="display: none;">
                <audio controls id="audioPlayer"></audio>
            </div>
        </div>

        <div class="chat-panel">
            <div class="chat-header">
                💬 Conversation avec Avo
            </div>
            
            <div class="chat-history" id="chatHistory">
                <div class="message agent">
                    <div class="timestamp">Maintenant</div>
                    <div class="agent-message">
                        Bonjour ! Je suis Avo, votre agent visuel. Écrivez-moi un message pour commencer la conversation !
                    </div>
                </div>
            </div>

            <div class="chat-input">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Tapez votre message..." 
                    autocomplete="off"
                >
                <button id="sendButton">Envoyer</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const chatHistory = document.getElementById('chatHistory');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const status = document.getElementById('status');
        const videoContainer = document.getElementById('videoContainer');
        const faceImage = document.getElementById('faceImage');
        const audioControls = document.getElementById('audioControls');
        const audioPlayer = document.getElementById('audioPlayer');

        let isProcessing = false;

        // Charger l'historique au chargement
        socket.on('connect', () => {
            console.log('Connecté au serveur');
            loadHistory();
        });

        socket.on('history', (history) => {
            displayHistory(history);
        });

        socket.on('processing', (data) => {
            status.textContent = data.message;
            status.classList.add('processing');
            isProcessing = true;
        });

        socket.on('response_ready', (data) => {
            status.textContent = 'Réponse prête !';
            status.classList.remove('processing');
            isProcessing = false;
            displayResponse(data);
        });

        async function loadHistory() {
            try {
                const response = await fetch('/api/history');
                const history = await response.json();
                displayHistory(history);
            } catch (error) {
                console.error('Erreur chargement historique:', error);
            }
        }

        function displayHistory(history) {
            chatHistory.innerHTML = '';
            history.forEach(entry => {
                addMessageToHistory(entry.user, 'user', entry.timestamp);
                addMessageToHistory(entry.agent, 'agent', entry.timestamp);
            });
            scrollToBottom();
        }

        function addMessageToHistory(text, type, timestamp) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const timestampDiv = document.createElement('div');
            timestampDiv.className = 'timestamp';
            timestampDiv.textContent = formatTimestamp(timestamp);
            
            const textDiv = document.createElement('div');
            textDiv.className = `${type}-message`;
            textDiv.textContent = text;
            
            messageDiv.appendChild(timestampDiv);
            messageDiv.appendChild(textDiv);
            chatHistory.appendChild(messageDiv);
        }

        function formatTimestamp(timestamp) {
            if (!timestamp) return 'Maintenant';
            const date = new Date(timestamp);
            return date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        }

        function scrollToBottom() {
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || isProcessing) return;

            isProcessing = true;
            sendButton.disabled = true;
            status.textContent = 'Traitement en cours...';
            status.classList.add('processing');

            // Ajouter le message utilisateur immédiatement
            addMessageToHistory(message, 'user', new Date().toISOString());
            messageInput.value = '';
            scrollToBottom();

            try {
                const response = await fetch('/api/interact', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                displayResponse(data);
            } catch (error) {
                console.error('Erreur:', error);
                status.textContent = 'Erreur de communication';
                status.classList.remove('processing');
            } finally {
                isProcessing = false;
                sendButton.disabled = false;
            }
        }

        function displayResponse(data) {
            // Ajouter la réponse
            addMessageToHistory(data.response, 'agent', new Date().toISOString());
            scrollToBottom();

            // Jouer l'audio
            if (data.audio_path) {
                const audioFilename = data.audio_path.split('/').pop();
                audioPlayer.src = `/api/audio/${audioFilename}`;
                audioControls.style.display = 'block';
                audioPlayer.play();
            }

            // Afficher la vidéo
            if (data.video_path) {
                const videoFilename = data.video_path.split('/').pop();
                videoContainer.innerHTML = `<video autoplay controls src="/api/video/${videoFilename}"></video>`;
            }

            status.textContent = 'Prêt';
            status.classList.remove('processing');
        }

        // Événements
        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Charger l'historique au démarrage
        loadHistory();
    </script>
</body>
</html>
